name: reviewer_consensus
description: |
  Reviewer consensus loop with three parallel review stages. The executor
  produces research artifacts, then three independent reviewers (standard,
  adversarial, biological plausibility) critique them in parallel. A
  consensus merger deduplicates similar critiques, escalates severity when
  multiple reviewers agree, and produces a ranked critique list that feeds
  back to the executor.
version: "1.0.0"

nodes:
  - id: executor
    role: executor
    prompt_ref: "executor/mi_executor"
    config:
      save_checkpoints: true
      artifact_types: ["MECH.md", "EVAL.md", "XP.md", "METHOD.md", "RUN_SUMMARY.md"]

  - id: reviewer
    role: reviewer
    prompt_ref: "reviewer/mi_reviewer"
    config:
      min_severity_to_block: "high"
      pass_grade: "B"

  - id: adversarial_reviewer
    role: adversarial_reviewer
    prompt_ref: "adversarial_reviewer/adversarial_reviewer"
    config:
      threat_models: ["p_hacking", "overclaiming", "causal_confusion", "dataset_leakage", "biological_implausibility", "statistical_theater", "null_model_inadequacy"]

  - id: bio_plausibility_checker
    role: bio_plausibility_checker
    prompt_ref: "biological_plausibility/bio_plausibility_checker"
    config:
      check_tissue_specificity: true
      check_pathway_consistency: true
      check_expression_levels: true

  - id: consensus_merger
    role: consensus_merger
    prompt_ref: ""
    config:
      merge_strategy: "deduplicate_escalate"
      # Default for consensus_similarity_method (run config overrides): LLM
      # adjudication, the platform default (best held-out F1 in
      # experiments/benchmark/results/merge_eval.json); a failed adjudication
      # falls back to tfidf at its calibrated threshold 0.1. llm takes no
      # threshold; a similarity_threshold set here applies only to the
      # similarity_method set here (ignored when the run config selects another).
      similarity_method: "llm"
      escalate_on_agreement: true

edges:
  # Executor fans out to all three reviewers in parallel
  - source: executor
    target: reviewer
    condition: "always"

  - source: executor
    target: adversarial_reviewer
    condition: "always"

  - source: executor
    target: bio_plausibility_checker
    condition: "always"

  # All three reviewers feed into consensus merger
  - source: reviewer
    target: consensus_merger
    condition: "always"

  - source: adversarial_reviewer
    target: consensus_merger
    condition: "always"

  - source: bio_plausibility_checker
    target: consensus_merger
    condition: "always"

  # Consensus merger sends merged feedback back to executor
  - source: consensus_merger
    target: executor
    condition: "always"

# Evaluated by the engine. Values map onto the run-config keys of the same
# name; a value set in the run config overrides the one given here.
stop_conditions:
  - "user_stop"
  - "budget_exceeded"
  - "max_iterations:50"      # cap; the run's own max_iterations also applies
  - "grade_at_least:A"       # stop after a review step graded A or better
  # Built-in defaults (no entry needed; the stopping calibration in
  # experiments/stopping/results/ selected them): "revision_budget:4" (the
  # initial executor submission plus at most 4 revisions, the last one still
  # reviewed; stop reason revision_budget) and "convergence_enabled:false"
  # (the adaptive rule is opt-in). "revision_budget:none" removes the budget.

max_iterations: 50

config:
  initial_node: executor
  feedback_passthrough: true
  accumulate_artifacts: true
  parallel_reviewers: true
