[pytest]
testpaths = backend/tests
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
filterwarnings =
    # backend/tests/test_repropack.py applies a module-level
    # ``pytestmark = pytest.mark.asyncio`` that also hits its sync tests.
    # Harmless; the real fix is to mark only the async tests in that file.
    ignore:The test <Function .*> is marked with '@pytest.mark.asyncio' but it is not an async function:pytest.PytestWarning
